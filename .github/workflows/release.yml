name: Release

# ==============================================================================
# Decides whether the commits merged to main since the last release
# warrant a new version, and if so, creates that version tag.
#
# Nothing is built or deployed here -- this workflow's only job is
# deciding "is there a new version, and what is it". build-and-push.yml
# reacts to the tag this creates.
#
# Version comes from commit messages (Conventional Commits):
#   fix:              -> patch  (1.2.3 -> 1.2.4)
#   feat:             -> minor  (1.2.3 -> 1.3.0)
#   feat!: / BREAKING -> major  (1.2.3 -> 2.0.0)
#   chore:/docs:/etc  -> no release at all
#
# A push containing only non-qualifying commits produces no tag, no
# build, and no deploy -- that is normal, not a failure.
#
# The "[skip ci]" in the release commit message (see .releaserc.json)
# matters: semantic-release commits CHANGELOG.md back to main, and
# without that marker it would re-trigger this very workflow in a loop.
# ==============================================================================

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # semantic-release needs full history and tags to work out what
          # the last release actually was -- a shallow clone makes it
          # think every run is the first release ever.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@25 \
            @semantic-release/changelog@7 \
            @semantic-release/git@11

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release