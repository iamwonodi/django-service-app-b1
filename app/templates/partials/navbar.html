<nav class="bg-gray-800 shadow-lg">
  <div class="container mx-auto px-4 py-4 flex items-center justify-end gap-4">
    {% if user.is_authenticated %}
    <a href="{% url 'users:profile' %}" class="text-gray-200 hover:text-purple-400">{{ user.get_username }}</a>
    <form method="post" action="{% url 'users:logout' %}">
      {% csrf_token %}
      <button type="submit" class="text-gray-400 hover:text-purple-400">Sign out</button>
    </form>
    {% else %}
    <a href="{% url 'users:login' %}" class="text-gray-200 hover:text-purple-400">Sign in</a>
    {% endif %}
  </div>
</nav>
