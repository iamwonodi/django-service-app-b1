{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-gray-800 rounded-lg p-8">
  <h1 class="text-2xl font-bold mb-6 text-purple-400">Sign in</h1>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="block mb-1 text-gray-200">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}" />
    <button
      type="submit"
      class="w-full bg-purple-600 text-white py-3 px-6 rounded-lg hover:bg-purple-700 transition duration-200"
    >
      Sign in
    </button>
  </form>
</div>
{% endblock %}
