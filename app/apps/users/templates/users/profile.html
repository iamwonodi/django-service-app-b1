{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-gray-800 rounded-lg p-8">
  <h1 class="text-2xl font-bold mb-6 text-purple-400">{{ user.get_full_name|default:user.get_username }}</h1>

  <dl class="space-y-2 mb-6">
    <dt class="text-gray-400">Username</dt>
    <dd>{{ user.get_username }}</dd>
    <dt class="text-gray-400">Email</dt>
    <dd>{{ user.email|default:"-" }}</dd>
    <dt class="text-gray-400">Member since</dt>
    <dd>{{ user.date_joined|date:"j F Y" }}</dd>
  </dl>

  <form method="post" action="{% url 'users:logout' %}">
    {% csrf_token %}
    <button
      type="submit"
      class="w-full bg-gray-700 text-white py-3 px-6 rounded-lg hover:bg-gray-600 transition duration-200"
    >
      Sign out
    </button>
  </form>
</div>
{% endblock %}
